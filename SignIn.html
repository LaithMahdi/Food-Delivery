<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--link style-->
    <link rel="stylesheet" href="CSS/styleSign.css">
    <link rel="stylesheet" href="CSS/bootstrap.css">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <!-- link Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <!-- Animate CSS -->
    <link rel="stylesheet" href="CSS/animate.css">

    <title>Se connecter</title>
</head>
<body>
   <section id="form" class="form my-5">
    <div class="container">
        <div class="box rounded-2">
            <div class=""><a href="index.html" class="mx-3"><i class="fa-solid fa-angle-left"></i></a></div>
            <div class="bg text-center">
                <img src="images/BGSi.png" alt="" class="img-fluid w-75">
            </div>
            <h1 class="m-3 titleFont">Logo</h1>
            <h3 class="m-3 titleFont">Se connecter</h3>
            <div class="form-floating m-3">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput" class="font">Adresse Mail</label>
                <span id="emailAlert"></span>
              </div>
              <div class="form-floating m-3">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword" class="font">Mot de passe</label>
              </div>
              <div class="text-center"><button class="font">Se connecter</button></div>
              
              <p class="text-center mt-3 font fw-light">vous n'avez pas encore de compte? <a href="Signup.html">créer un</a> </p>
        </div>
    </div>
   </section>
   <script src="js/script.js"></script>
</body>
</html>
